<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warna Produk — Admin Giva Store</title>
  <meta name="description" content="Kelola semua warna produk Giva Store." />
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body
  class="bg-cream text-ink min-h-screen font-sans antialiased"
  x-data="colorsAdmin"
  x-init="init()">

  <div class="flex min-h-screen">

        <div id="admin-sidebar"></div>


    <!-- ══════════════════════════════════════════════════════════
         MAIN CONTENT
    ═══════════════════════════════════════════════════════════ -->
    <div class="flex-1 flex flex-col min-w-0">

      <!-- Top bar -->
      <header class="bg-cream/80 backdrop-blur border-b border-border px-4 sm:px-8 py-4 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-3 min-w-0">
          <!-- Hamburger (mobile only) -->
          <button
            id="btn-hamburger"
            onclick="openSidebar()"
            class="lg:hidden w-11 h-11 -ml-1 rounded-lg text-stone hover:text-ink hover:bg-sand flex items-center justify-center transition-all flex-shrink-0">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <div class="min-w-0">
            <h1 class="text-lg sm:text-2xl font-display font-semibold text-ink leading-tight">Warna Produk</h1>
            <p class="text-xs text-stone mt-0.5 hidden sm:block">Kelola semua pilihan warna produk</p>
          </div>
        </div>
        <button
          id="btn-tambah-warna"
          @click="openAddModal()"
          class="inline-flex items-center gap-2 px-3 sm:px-4 py-2 sm:py-2.5 rounded-lg bg-sage hover:bg-sage-deep text-white text-sm font-medium transition-colors flex-shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          <span class="hidden sm:inline">Tambah Warna</span>
          <span class="sm:hidden">Tambah</span>
        </button>
      </header>

      <!-- Content -->
      <main class="flex-1 p-4 sm:p-8">

        <!-- ── Alert Toast ──────────────────────────────────────── -->
        <div
          x-show="alert.show"
          x-transition:enter="transition ease-out duration-300"
          x-transition:enter-start="opacity-0 -translate-y-1"
          x-transition:enter-end="opacity-100 translate-y-0"
          x-transition:leave="transition ease-in duration-200"
          x-transition:leave-start="opacity-100"
          x-transition:leave-end="opacity-0"
          :class="{
            'border-sage/40 bg-sage/8 text-sage-deep': alert.type === 'success',
            'border-red-300 bg-red-50 text-red-700': alert.type === 'error',
            'border-amber-300 bg-amber-50 text-amber-700': alert.type === 'warning',
          }"
          class="mb-6 flex items-start gap-3 px-4 py-3.5 rounded-xl border text-sm font-medium"
          style="display: none;">
          <template x-if="alert.type === 'success'">
            <svg class="w-4 h-4 mt-0.5 flex-shrink-0 text-sage" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </template>
          <template x-if="alert.type === 'error'">
            <svg class="w-4 h-4 mt-0.5 flex-shrink-0 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </template>
          <template x-if="alert.type === 'warning'">
            <svg class="w-4 h-4 mt-0.5 flex-shrink-0 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
          </template>
          <span x-text="alert.message" class="flex-1"></span>
          <button @click="alert.show = false" class="flex-shrink-0 opacity-50 hover:opacity-80 transition-opacity">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- ── Color list card ──────────────────────────────────── -->
        <div class="bg-white border border-border rounded-2xl overflow-hidden">

          <!-- Loading skeleton -->
          <div x-show="loading" class="divide-y divide-border">
            <template x-for="i in 5" :key="i">
              <div class="px-6 py-4 flex items-center gap-4">
                <div class="w-9 h-9 rounded-xl bg-sand animate-pulse flex-shrink-0"></div>
                <div class="flex-1 space-y-2">
                  <div class="h-4 bg-sand rounded animate-pulse w-1/3"></div>
                  <div class="h-3 bg-sand rounded animate-pulse w-1/5"></div>
                </div>
              </div>
            </template>
          </div>

          <!-- Empty state -->
          <div x-show="!loading && colors.length === 0"
            class="flex flex-col items-center justify-center py-20 text-center px-6">
            <div class="w-16 h-16 rounded-2xl bg-sand border border-border flex items-center justify-center mb-4">
              <svg class="w-8 h-8 text-stone/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
              </svg>
            </div>
            <p class="font-display font-semibold text-ink text-lg mb-1">Belum ada warna</p>
            <p class="text-sm text-stone mb-5">Tambahkan warna pertama untuk mulai mengelompokkan produk.</p>
            <button @click="openAddModal()"
              class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg bg-sage hover:bg-sage-deep text-white text-sm font-medium transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
              </svg>
              Tambah Warna
            </button>
          </div>

          <!-- Desktop table (md+) -->
          <table x-show="!loading && colors.length > 0" class="w-full hidden md:table">
            <thead>
              <tr class="border-b border-border bg-sand/60">
                <th class="px-6 py-3.5 text-left text-[11px] font-semibold uppercase tracking-widest text-stone">Warna</th>
                <th class="px-6 py-3.5 text-left text-[11px] font-semibold uppercase tracking-widest text-stone">Nama</th>
                <th class="px-6 py-3.5 text-left text-[11px] font-semibold uppercase tracking-widest text-stone">Kode Hex</th>
                <th class="px-6 py-3.5 text-right text-[11px] font-semibold uppercase tracking-widest text-stone">Aksi</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-border">
              <template x-for="color in colors" :key="color.id">
                <tr class="hover:bg-cream/60 transition-colors group">
                  <!-- Color swatch -->
                  <td class="px-6 py-4">
                    <div class="w-9 h-9 rounded-xl border border-border/60 flex-shrink-0 shadow-sm"
                      :style="'background-color:' + color.hex_code"></div>
                  </td>
                  <!-- Name -->
                  <td class="px-6 py-4">
                    <p class="text-sm font-medium text-ink" x-text="color.name"></p>
                  </td>
                  <!-- Hex code -->
                  <td class="px-6 py-4">
                    <span class="inline-flex items-center gap-2 px-2.5 py-1 rounded-lg bg-sand border border-border text-xs font-mono text-stone">
                      <span class="w-3 h-3 rounded-sm flex-shrink-0" :style="'background-color:' + color.hex_code"></span>
                      <span x-text="color.hex_code"></span>
                    </span>
                  </td>
                  <!-- Actions -->
                  <td class="px-6 py-4 text-right">
                    <div class="flex items-center justify-end gap-2">
                      <button
                        :id="'btn-edit-' + color.id"
                        @click="openEditModal(color)"
                        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-stone hover:text-ink hover:bg-sand border border-transparent hover:border-border transition-all">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                        Edit
                      </button>
                      <button
                        :id="'btn-hapus-' + color.id"
                        @click="confirmDeleteColor(color)"
                        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-stone hover:text-red-600 hover:bg-red-50 border border-transparent hover:border-red-200 transition-all">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                        Hapus
                      </button>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>

          <!-- Mobile card list (< md) -->
          <div x-show="!loading && colors.length > 0" class="md:hidden divide-y divide-border">
            <template x-for="color in colors" :key="color.id">
              <div class="px-4 py-4 flex items-center gap-4">
                <!-- Swatch -->
                <div class="w-11 h-11 rounded-xl border border-border/60 flex-shrink-0 shadow-sm"
                  :style="'background-color:' + color.hex_code"></div>
                <!-- Info -->
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-semibold text-ink" x-text="color.name"></p>
                  <span class="inline-flex items-center gap-1.5 mt-1 px-2 py-0.5 rounded-md bg-sand border border-border text-xs font-mono text-stone">
                    <span class="w-2.5 h-2.5 rounded-sm" :style="'background-color:' + color.hex_code"></span>
                    <span x-text="color.hex_code"></span>
                  </span>
                </div>
                <!-- Actions -->
                <div class="flex items-center gap-1 flex-shrink-0">
                  <button @click="openEditModal(color)"
                    class="w-9 h-9 rounded-lg text-stone hover:text-ink hover:bg-sand border border-transparent hover:border-border flex items-center justify-center transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                    </svg>
                  </button>
                  <button @click="confirmDeleteColor(color)"
                    class="w-9 h-9 rounded-lg text-stone hover:text-red-600 hover:bg-red-50 border border-transparent hover:border-red-200 flex items-center justify-center transition-all">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                  </button>
                </div>
              </div>
            </template>
          </div>

          <!-- Footer count -->
          <div x-show="!loading && colors.length > 0"
            class="px-6 py-3.5 border-t border-border bg-sand/40 flex items-center justify-between">
            <p class="text-xs text-stone">
              Total <span class="font-semibold text-ink" x-text="colors.length"></span> warna
            </p>
          </div>

        </div>
        <!-- end list card -->

      </main>
    </div>
    <!-- end main -->

  </div>
  <!-- end flex layout -->

  <!-- ══════════════════════════════════════════════════════════
       MODAL TAMBAH / EDIT WARNA
  ═══════════════════════════════════════════════════════════ -->
  <div
    x-show="showModal"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @keydown.escape.window="closeModal()"
    class="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4"
    style="display:none;">

    <!-- Backdrop -->
    <div class="absolute inset-0 bg-ink/20 backdrop-blur-sm" @click="closeModal()"></div>

    <!-- Panel -->
    <div
      x-show="showModal"
      x-transition:enter="transition ease-out duration-250"
      x-transition:enter-start="opacity-0 translate-y-4 sm:scale-95 sm:translate-y-0"
      x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
      x-transition:leave-end="opacity-0 translate-y-4 sm:scale-95 sm:translate-y-0"
      class="relative w-full sm:max-w-md bg-white sm:border border-t sm:border-border sm:rounded-2xl
             rounded-t-2xl flex flex-col overflow-hidden shadow-xl">

      <!-- Drag handle (mobile) -->
      <div class="absolute top-2.5 left-1/2 -translate-x-1/2 w-10 h-1 rounded-full bg-border sm:hidden"></div>

      <!-- Modal header -->
      <div class="px-5 sm:px-6 pt-7 sm:pt-5 pb-4 border-b border-border flex items-center justify-between flex-shrink-0">
        <h2 class="text-base font-display font-semibold text-ink"
          x-text="isEditing ? 'Edit Warna' : 'Tambah Warna'"></h2>
        <button @click="closeModal()"
          class="w-9 h-9 rounded-lg text-stone hover:text-ink hover:bg-sand flex items-center justify-center transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Modal body -->
      <div class="px-5 sm:px-6 py-5 space-y-5">

        <!-- Nama warna -->
        <div>
          <label for="input-nama-warna" class="block text-xs font-semibold text-stone uppercase tracking-wider mb-1.5">
            Nama Warna <span class="text-red-400">*</span>
          </label>
          <input
            id="input-nama-warna"
            type="text"
            x-model="form.name"
            @keydown.enter="saveColor()"
            placeholder="cth. Merah Marun, Navy Blue…"
            class="w-full px-4 py-2.5 rounded-xl bg-sand border border-border text-ink placeholder-stone text-sm
                   focus:outline-none focus:ring-2 focus:ring-sage/30 focus:border-sage/60
                   hover:border-stone/50 transition-all" />
        </div>

        <!-- Kode Hex — picker + text -->
        <div>
          <label class="block text-xs font-semibold text-stone uppercase tracking-wider mb-1.5">
            Kode Warna (Hex)
          </label>

          <div class="flex items-center gap-3">
            <!-- Color picker -->
            <label class="flex-shrink-0 cursor-pointer group" title="Klik untuk memilih warna">
              <div class="relative w-12 h-12 rounded-xl border-2 border-border hover:border-sage/50 transition-all overflow-hidden shadow-sm group-hover:shadow-md"
                :style="'background-color:' + pickerValue">
                <input
                  id="input-color-picker"
                  type="color"
                  :value="pickerValue"
                  @input="onPickerChange($event)"
                  class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                <!-- Overlay hint -->
                <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-black/20 transition-opacity">
                  <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
                  </svg>
                </div>
              </div>
            </label>

            <!-- Text input hex manual -->
            <div class="flex-1 relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-stone text-sm font-mono select-none">#</span>
              <input
                id="input-hex-text"
                type="text"
                :value="form.hex_code.replace('#', '')"
                @input="onTextChange($event)"
                maxlength="7"
                placeholder="8FA07E"
                class="w-full pl-8 pr-4 py-2.5 rounded-xl bg-sand border border-border text-ink text-sm font-mono
                       focus:outline-none focus:ring-2 focus:ring-sage/30 focus:border-sage/60
                       hover:border-stone/50 transition-all uppercase"
                :class="/^#[0-9A-Fa-f]{6}$/.test(form.hex_code) ? '' : 'border-amber-300 focus:ring-amber-200 focus:border-amber-400'" />
            </div>
          </div>

          <!-- Preview chip -->
          <div class="mt-3 flex items-center gap-2 px-3 py-2 rounded-lg bg-sand border border-border">
            <div class="w-5 h-5 rounded-md border border-border/60 flex-shrink-0"
              :style="'background-color:' + pickerValue"></div>
            <span class="text-xs text-stone font-mono" x-text="form.hex_code || '#—'"></span>
            <span class="text-xs text-stone/60 ml-auto" x-show="form.name" x-text="form.name"></span>
          </div>
        </div>

      </div>

      <!-- Modal footer -->
      <div class="px-5 sm:px-6 py-4 border-t border-border flex gap-3 flex-shrink-0 bg-white">
        <button
          @click="closeModal()"
          class="flex-1 py-2.5 rounded-xl border border-border bg-sand hover:bg-border text-ink text-sm font-medium transition-colors">
          Batal
        </button>
        <button
          id="btn-simpan-warna"
          @click="saveColor()"
          :disabled="saving"
          class="flex-1 py-2.5 rounded-xl bg-sage hover:bg-sage-deep disabled:bg-sage/50 text-white text-sm font-semibold transition-colors flex items-center justify-center gap-2">
          <svg x-show="saving" class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span x-text="saving ? 'Menyimpan…' : (isEditing ? 'Simpan Perubahan' : 'Tambah Warna')"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       DIALOG KONFIRMASI HAPUS
  ═══════════════════════════════════════════════════════════ -->
  <div
    x-show="confirmDelete.show"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @keydown.escape.window="cancelDelete()"
    class="fixed inset-0 z-50 flex items-center justify-center p-4"
    style="display:none;">

    <div class="absolute inset-0 bg-ink/20 backdrop-blur-sm" @click="cancelDelete()"></div>

    <div
      x-show="confirmDelete.show"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0 scale-95"
      x-transition:enter-end="opacity-100 scale-100"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="opacity-100 scale-100"
      x-transition:leave-end="opacity-0 scale-95"
      class="relative w-full max-w-sm bg-white border border-border rounded-2xl shadow-xl p-6">

      <!-- Icon -->
      <div class="w-12 h-12 rounded-2xl bg-red-50 border border-red-100 flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      </div>

      <h3 class="text-base font-display font-semibold text-ink text-center mb-1">Hapus Warna?</h3>
      <p class="text-sm text-stone text-center mb-6">
        Warna <span class="font-semibold text-ink" x-text="confirmDelete.color?.name"></span>
        akan dihapus permanen. Tindakan ini tidak dapat dibatalkan.
      </p>

      <!-- Color preview -->
      <div class="flex items-center gap-3 px-4 py-3 rounded-xl bg-sand border border-border mb-6">
        <div class="w-8 h-8 rounded-lg border border-border/60 flex-shrink-0"
          :style="'background-color:' + (confirmDelete.color?.hex_code || '#ccc')"></div>
        <div>
          <p class="text-sm font-semibold text-ink" x-text="confirmDelete.color?.name"></p>
          <p class="text-xs font-mono text-stone" x-text="confirmDelete.color?.hex_code"></p>
        </div>
      </div>

      <div class="flex gap-3">
        <button @click="cancelDelete()"
          class="flex-1 py-2.5 rounded-xl border border-border bg-sand hover:bg-border text-ink text-sm font-medium transition-colors">
          Batal
        </button>
        <button
          id="btn-konfirmasi-hapus"
          @click="deleteColor()"
          class="flex-1 py-2.5 rounded-xl bg-red-500 hover:bg-red-600 text-white text-sm font-semibold transition-colors">
