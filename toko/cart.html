<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keranjang — Giva Store</title>
  <meta name="description" content="Keranjang belanja Giva Store." />
  <link rel="stylesheet" href="/src/style.css" />
  <style>[x-cloak]{display:none!important}</style>
</head>

<body class="bg-cream text-ink min-h-screen font-sans antialiased" x-data="storeCart" x-init="init()" x-cloak>

  <div id="navbar-container"></div>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 sm:py-10">
    <div class="mb-8">
      <p class="text-xs font-semibold tracking-[0.18em] uppercase text-sage-deep mb-2">Shopping bag</p>
      <h1 class="font-display text-3xl sm:text-4xl font-semibold tracking-tight">Keranjang</h1>
    </div>

    <div x-show="loading" class="animate-pulse h-40 rounded-2xl bg-sand border border-border"></div>

    <div x-show="!loading && isEmpty" class="rounded-2xl border border-dashed border-border bg-white px-6 py-16 text-center" style="display:none;">
      <p class="font-display text-2xl text-ink mb-2">Keranjang masih kosong</p>
      <p class="text-sm text-stone mb-6">Jelajahi koleksi dan tambahkan produk favorit Anda.</p>
      <a href="/toko/products.html" class="inline-flex min-h-[48px] px-6 items-center rounded-full bg-sage text-white text-sm font-semibold hover:bg-sage-deep">Lanjut Belanja</a>
    </div>

    <div x-show="!loading && !isEmpty" class="grid lg:grid-cols-3 gap-8" style="display:none;">
      <div class="lg:col-span-2 space-y-3">
        <template x-for="item in items" :key="item.cartKey">
          <article class="flex gap-3 sm:gap-4 p-3 sm:p-4 rounded-2xl border border-border bg-white">
            <a :href="productUrl(item.product_id)" class="w-20 h-20 sm:w-24 sm:h-24 rounded-xl bg-sand border border-border overflow-hidden flex-shrink-0">
              <template x-if="item.image_url">
                <img :src="item.image_url" :alt="item.name" class="w-full h-full object-cover" />
              </template>
              <template x-if="!item.image_url">
                <div class="w-full h-full flex items-center justify-center text-stone/40 text-xs">No img</div>
              </template>
            </a>
            <div class="flex-1 min-w-0">
              <div class="flex justify-between gap-2">
                <div class="min-w-0">
                  <a :href="productUrl(item.product_id)" class="text-sm font-semibold text-ink hover:text-sage-deep line-clamp-2" x-text="item.name"></a>
                  <p x-show="item.color_name" class="mt-1 text-xs text-stone flex items-center gap-1.5" style="display:none;">
                    <span class="w-3 h-3 rounded-full border border-border inline-block" :style="`background:${item.color_hex||'#ccc'}`"></span>
                    <span x-text="item.color_name"></span>
                  </p>
                  <p class="mt-1 text-sm text-ink" x-text="formatPrice(item.sell_price)"></p>
                </div>
                <button type="button" @click="remove(item)" class="w-10 h-10 flex-shrink-0 rounded-full text-stone hover:text-red-600 hover:bg-red-50" aria-label="Hapus">
                  <svg class="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
              <div class="mt-3 flex flex-wrap items-center justify-between gap-3">
                <div class="inline-flex items-center rounded-xl border border-border overflow-hidden bg-cream/40">
                  <button type="button" @click="dec(item)" class="w-10 h-10 flex items-center justify-center hover:bg-sand">−</button>
                  <input type="number" min="1" :value="item.qty" @change="setQty(item, $event.target.value)"
                    class="w-12 h-10 text-center text-sm font-semibold border-x border-border bg-transparent focus:outline-none" />
                  <button type="button" @click="inc(item)" class="w-10 h-10 flex items-center justify-center hover:bg-sand">+</button>
                </div>
                <p class="text-sm font-semibold" x-text="formatPrice(lineSubtotal(item))"></p>
              </div>
            </div>
          </article>
        </template>
      </div>

      <aside class="lg:sticky lg:top-24 h-fit rounded-2xl border border-border bg-white p-5 sm:p-6">
        <h2 class="font-display text-xl font-semibold mb-4">Ringkasan</h2>
        <div class="space-y-3 text-sm">
          <div class="flex justify-between gap-3">
            <span class="text-stone">Subtotal</span>
            <span class="font-semibold" x-text="formatPrice(subtotal)"></span>
          </div>
          <div class="flex justify-between gap-3">
            <span class="text-stone">Ongkir</span>
            <span class="text-stone text-right text-xs sm:text-sm">Dihitung saat checkout</span>
          </div>
          <div class="border-t border-border pt-3 flex justify-between gap-3">
            <span class="font-medium">Total sementara</span>
            <span class="text-lg font-semibold" x-text="formatPrice(subtotal)"></span>
          </div>
        </div>
        <button type="button" @click="goCheckout()"
          class="mt-6 w-full min-h-[48px] rounded-full bg-sage hover:bg-sage-deep text-white text-sm font-semibold transition-colors">
          Lanjut ke Checkout
        </button>
        <a href="/toko/products.html"
          class="mt-3 flex w-full min-h-[48px] items-center justify-center rounded-full border border-border bg-sand text-sm font-semibold hover:bg-border transition-colors">
          Lanjut Belanja
        </a>
      </aside>
    </div>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="/src/toko/cart.js"></script>
</body>
</html>
