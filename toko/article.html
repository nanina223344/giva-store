<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artikel Inspirasi — Giva Store</title>
  <meta name="description" content="Baca artikel inspirasi, tips, dan cerita gaya hidup dari Giva Store." />
  <link rel="stylesheet" href="/src/style.css" />
  <style>[x-cloak] { display: none !important; }</style>
</head>

<body
  class="bg-cream text-ink min-h-screen font-sans antialiased flex flex-col justify-between"
  x-data="storeArticleDetail"
  x-init="init()"
  x-cloak>

  <!-- Dynamic Navbar -->
  <div id="navbar-container"></div>

  <!-- Loading State Skeleton -->
  <div x-show="loading" class="flex-1 max-w-3xl mx-auto px-4 py-16 space-y-6 w-full animate-pulse">
    <div class="h-4 bg-sand rounded w-1/3"></div>
    <div class="h-8 bg-sand rounded w-3/4"></div>
    <div class="h-4 bg-sand rounded w-full"></div>
    <div class="aspect-video bg-sand rounded-2xl"></div>
    <div class="space-y-3 pt-6">
      <div class="h-4 bg-sand rounded w-full"></div>
      <div class="h-4 bg-sand rounded w-full"></div>
      <div class="h-4 bg-sand rounded w-2/3"></div>
    </div>
  </div>

  <!-- Article Main Content (Centered max-w-3xl = 760px for Readability) -->
  <main x-show="!loading && article" class="flex-1 max-w-[760px] mx-auto px-4 sm:px-6 py-8 sm:py-12 space-y-8 w-full">

    <!-- Breadcrumb Navigation -->
    <nav class="flex items-center gap-2 text-xs text-stone">
      <a href="/toko/index.html" class="hover:text-ink">Beranda</a>
      <span>›</span>
      <a href="/toko/inspirasi.html" class="hover:text-ink">Inspirasi</a>
      <span>›</span>
      <span class="text-ink font-medium truncate max-w-[200px]" x-text="article?.title"></span>
    </nav>

    <!-- Article Header -->
    <header class="space-y-4 text-center sm:text-left">
      <!-- Category Pills -->
      <div class="flex items-center justify-center sm:justify-start gap-2 flex-wrap">
        <template x-for="cat in (article?.categories || [])" :key="cat.id">
          <span class="inline-flex px-3 py-1 rounded-full text-xs font-semibold bg-sage/15 text-sage-deep border border-sage/25" x-text="cat.name"></span>
        </template>
      </div>

      <!-- Title -->
      <h1 class="font-display text-3xl sm:text-5xl font-semibold text-ink leading-tight" x-text="article?.title"></h1>

      <!-- Excerpt Lead Subtitle -->
      <template x-if="article?.excerpt">
        <p class="text-stone text-base sm:text-lg leading-relaxed font-medium" x-text="article?.excerpt"></p>
      </template>

      <!-- Date & Read Time Info -->
      <div class="flex items-center justify-center sm:justify-start gap-3 text-xs text-stone border-t border-border pt-4">
        <span x-text="formatDate(article?.published_at)"></span>
        <span>•</span>
        <span x-text="`${article?.readTimeMinutes || 1} mnt baca`"></span>
        <span>•</span>
        <span x-text="`${article?.view_count || 0} dibaca`"></span>
      </div>
    </header>

    <!-- Article Cover Image -->
    <template x-if="article?.cover_image_url">
      <div class="aspect-[16/9] rounded-2xl border border-border overflow-hidden bg-sand shadow-sm">
        <img :src="article.cover_image_url" :alt="article.title" class="w-full h-full object-cover" />
      </div>
    </template>

    <!-- ── ARTICLE BODY BLOCKS ───────────────────────────────────────── -->
    <article class="space-y-6 text-ink leading-relaxed">
      <template x-for="block in blocks" :key="block.id">
        <div class="block-node">

          <!-- 1. HEADING BLOCK -->
          <template x-if="block.type === 'heading'">
            <div class="pt-4 pb-1">
              <template x-if="block.content.level === 2">
                <h2 class="font-display text-2xl sm:text-3xl font-semibold text-ink leading-tight" x-text="block.content.text"></h2>
              </template>
              <template x-if="block.content.level === 3">
                <h3 class="font-display text-xl sm:text-2xl font-semibold text-ink leading-tight" x-text="block.content.text"></h3>
              </template>
              <template x-if="block.content.level === 4">
                <h4 class="font-display text-lg font-semibold text-ink leading-tight" x-text="block.content.text"></h4>
              </template>
            </div>
          </template>

          <!-- 2. PARAGRAPH BLOCK -->
          <template x-if="block.type === 'paragraph'">
            <p class="text-base sm:text-lg leading-[1.8] text-ink font-sans" x-text="block.content.text"></p>
          </template>

          <!-- 3. IMAGE BLOCK -->
          <template x-if="block.type === 'image'">
            <figure class="py-3 space-y-2">
              <div @click="openLightbox(block.content.url)" class="rounded-2xl border border-border overflow-hidden bg-sand cursor-pointer group">
                <img :src="block.content.url" :alt="block.content.alt || article.title" class="w-full max-h-[500px] object-cover group-hover:scale-105 transition-transform duration-300" />
              </div>
              <template x-if="block.content.caption">
                <figcaption class="text-center text-xs text-stone italic font-sans" x-text="block.content.caption"></figcaption>
              </template>
            </figure>
          </template>

          <!-- 4. VIDEO BLOCK -->
          <template x-if="block.type === 'video'">
            <div class="py-3">
              <template x-if="block.content.type === 'youtube' && block.content.url">
                <div class="aspect-video rounded-2xl overflow-hidden border border-border bg-black shadow-sm">
                  <iframe :src="getYoutubeEmbedUrl(block.content.url)" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
                </div>
              </template>
            </div>
          </template>

          <!-- 5. QUOTE BLOCK -->
          <template x-if="block.type === 'quote'">
            <blockquote class="my-6 p-6 rounded-2xl border-l-4 border-sage bg-white border border-border shadow-sm space-y-2">
              <p class="font-display italic text-lg sm:text-xl text-ink leading-relaxed" x-text="`“${block.content.text}”`"></p>
              <template x-if="block.content.attribution">
                <cite class="block text-xs font-semibold text-stone not-italic" x-text="block.content.attribution"></cite>
              </template>
            </blockquote>
          </template>

          <!-- 6. PRODUCT EMBED BLOCK -->
          <template x-if="block.type === 'product'">
            <div class="my-6 p-4 sm:p-5 rounded-2xl bg-white border border-border shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
              <div class="flex items-center gap-4 min-w-0 w-full sm:w-auto">
                <img :src="block.content.product_image || '/placeholder.png'" class="w-20 h-20 rounded-xl object-cover border border-border bg-sand flex-shrink-0" />
                <div class="min-w-0">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-sage-deep bg-sage/15 px-2 py-0.5 rounded-full">Rekomendasi Produk</span>
                  <h4 class="font-display font-semibold text-base sm:text-lg text-ink truncate mt-1" x-text="block.content.product_name"></h4>
                  <p class="text-sm font-bold text-sage-deep mt-0.5" x-text="`Rp ${(block.content.product_price || 0).toLocaleString('id-ID')}`"></p>
                </div>
              </div>
              <a :href="`/toko/product-detail.html?id=${block.content.product_id}`"
                class="w-full sm:w-auto px-5 py-2.5 bg-sage hover:bg-sage-deep text-white text-xs font-semibold rounded-xl text-center transition-colors shadow-sm whitespace-nowrap cursor-pointer">
                Lihat Produk
              </a>
            </div>
          </template>

          <!-- 7. GALLERY BLOCK -->
          <template x-if="block.type === 'gallery'">
            <div class="py-4 grid grid-cols-2 sm:grid-cols-3 gap-3">
              <template x-for="(img, gIdx) in (block.content.images || [])" :key="gIdx">
                <div @click="openLightbox(img.url)" class="aspect-square rounded-xl border border-border overflow-hidden bg-sand cursor-pointer group">
                  <img :src="img.url" :alt="img.alt || 'Foto Galeri'" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                </div>
              </template>
            </div>
          </template>

          <!-- 8. DIVIDER BLOCK -->
          <template x-if="block.type === 'divider'">
            <div class="py-6">
              <hr class="border-t border-sage/30" />
            </div>
          </template>

          <!-- 9. SPACER BLOCK -->
          <template x-if="block.type === 'spacer'">
            <div :style="`height: ${block.content.height || 24}px`"></div>
          </template>

        </div>
      </template>
    </article>

    <!-- Tags List -->
    <template x-if="article?.tags && article.tags.length > 0">
      <div class="border-t border-border pt-6 flex items-center gap-2 flex-wrap text-xs">
        <span class="font-semibold text-stone">Tagar:</span>
        <template x-for="(tag, idx) in article.tags" :key="idx">
          <a :href="`/toko/inspirasi.html`" class="px-3 py-1 rounded-full bg-sand hover:bg-border text-ink font-medium">
            <span x-text="`#${tag}`"></span>
          </a>
        </template>
      </div>
    </template>

    <!-- ── SECTION: ARTIKEL TERKAIT ───────────────────────────────────── -->
    <div x-show="relatedArticles.length > 0" class="border-t-2 border-border pt-10 space-y-6">
      <div class="text-center sm:text-left">
        <h3 class="font-display text-2xl font-semibold text-ink">Artikel Terkait</h3>
        <p class="text-xs text-stone mt-1">Baca juga cerita dan panduan menarik lainnya.</p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
        <template x-for="rel in relatedArticles" :key="rel.id">
          <a :href="`/toko/article.html?slug=${rel.slug}`" class="group bg-white rounded-2xl border border-border overflow-hidden shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
            <div>
              <div class="aspect-[16/9] bg-sand overflow-hidden relative border-b border-border">
                <template x-if="rel.cover_image_url">
                  <img :src="rel.cover_image_url" :alt="rel.title" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
                </template>
                <template x-if="!rel.cover_image_url">
                  <div class="w-full h-full flex items-center justify-center text-stone/40">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                  </div>
                </template>
              </div>

              <div class="p-4 space-y-2">
                <h4 class="font-display text-base font-semibold text-ink group-hover:text-sage-deep transition-colors line-clamp-2" x-text="rel.title"></h4>
                <p class="text-stone text-xs line-clamp-2" x-text="rel.excerpt"></p>
              </div>
            </div>
            <div class="px-4 py-2.5 border-t border-border bg-sand/20 text-[10px] text-stone">
              <span x-text="formatDate(rel.published_at)"></span>
            </div>
          </a>
        </template>
      </div>
    </div>

  </main>

  <!-- Lightbox Modal for Photo Viewing -->
  <div x-show="showLightbox"
    x-transition
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-ink/80 backdrop-blur-sm"
    style="display:none;">
    <div class="relative max-w-4xl max-h-[90vh] overflow-hidden rounded-2xl">
      <button @click="closeLightbox()" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-black/60 text-white font-bold flex items-center justify-center">×</button>
      <img :src="lightboxImageUrl" class="max-w-full max-h-[85vh] object-contain rounded-2xl" />
    </div>
  </div>

  <!-- Dynamic Footer -->
  <div id="footer-container"></div>

  <script type="module" src="/src/toko/article-detail.js"></script>
</body>
</html>
