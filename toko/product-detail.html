<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Produk — Giva Store</title>
  <meta name="description" content="Detail produk pilihan dari Giva Store — material berkualitas dan desain timeless." />
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    [x-cloak] { display: none !important; }

    /* Product card hover zoom */
    .product-card:hover .product-img { transform: scale(1.05); }
    .product-img { transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1); }

    /* Horizontal scroll — hide native scrollbar */
    .hide-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    /* Out of stock variant box diagonal line */
    .variant-box-disabled {
      opacity: 0.4;
      cursor: not-allowed;
      position: relative;
      overflow: hidden;
    }
    .variant-box-disabled::after {
      content: '';
      position: absolute;
      top: 50%;
      left: -20%;
      width: 140%;
      height: 2px;
      background-color: #232019;
      transform: rotate(-45deg);
    }
  </style>
</head>

<body class="bg-cream text-ink min-h-screen font-sans antialiased" x-data="storeProductDetail" x-init="init()" x-cloak>

  <div id="navbar-container"></div>

  <!-- ── Toast Notification ─────────────────────────────────── -->
  <div
    x-show="toast.show"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0 translate-y-2 scale-95"
    x-transition:enter-end="opacity-100 translate-y-0 scale-100"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100 translate-y-0 scale-100"
    x-transition:leave-end="opacity-0 translate-y-2 scale-95"
    class="fixed top-20 right-4 z-50 px-4 py-3 rounded-2xl shadow-xl border flex items-center gap-3 backdrop-blur-md text-sm font-semibold max-w-sm"
    :class="toast.type === 'warning' ? 'bg-amber-600 text-white border-amber-700' : 'bg-sage-deep text-white border-sage-deep'"
    style="display: none;"
  >
    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path x-show="toast.type !== 'warning'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      <path x-show="toast.type === 'warning'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
    </svg>
    <span x-text="toast.message"></span>
  </div>

  <!-- ── Skeleton Loader (Initial Loading) ─────────────────── -->
  <div x-show="loading" class="max-w-[1400px] mx-auto px-4 sm:px-6 py-8 sm:py-12">
    <div class="grid grid-cols-1 lg:grid-cols-[55%_1fr] gap-8 lg:gap-16 items-start">
      <!-- Kiri: Rectangle 2:3 pulse animation -->
      <div class="aspect-[2/3] bg-sand rounded-2xl animate-pulse w-full"></div>
      <!-- Kanan: Placeholder baris -->
      <div class="space-y-6 pt-2">
        <div class="h-4 w-48 bg-sand rounded animate-pulse"></div>
        <div class="h-3 w-24 bg-sand rounded animate-pulse"></div>
        <div class="h-10 w-4/5 bg-sand rounded-lg animate-pulse"></div>
        <div class="h-8 w-36 bg-sand rounded-lg animate-pulse"></div>
        <div class="space-y-3 pt-4">
          <div class="h-4 w-32 bg-sand rounded animate-pulse"></div>
          <div class="flex gap-3">
            <div class="w-[44px] h-[44px] bg-sand rounded-lg animate-pulse"></div>
            <div class="w-[44px] h-[44px] bg-sand rounded-lg animate-pulse"></div>
            <div class="w-[44px] h-[44px] bg-sand rounded-lg animate-pulse"></div>
          </div>
        </div>
        <div class="h-14 w-full bg-sand rounded-xl animate-pulse pt-6"></div>
        <div class="space-y-4 pt-6">
          <div class="h-12 w-full bg-sand rounded-xl animate-pulse"></div>
          <div class="h-12 w-full bg-sand rounded-xl animate-pulse"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Not Found State ───────────────────────────────────── -->
  <div x-show="!loading && !product" class="max-w-4xl mx-auto px-4 py-24 text-center" style="display:none;">
    <div class="w-20 h-20 mx-auto bg-sand rounded-full flex items-center justify-center text-stone mb-5">
      <svg class="w-9 h-9" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
      </svg>
    </div>
    <h1 class="font-display text-3xl sm:text-4xl font-semibold text-ink mb-3">Produk Tidak Ditemukan</h1>
    <p class="text-stone mb-6">Produk yang Anda cari mungkin telah dihapus atau tidak tersedia.</p>
    <a href="/toko/products.html" class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-sage text-white text-sm font-semibold hover:bg-sage-deep transition-colors shadow-sm">
      Kembali ke Katalog
    </a>
  </div>

  <!-- ── Main Detail Content ───────────────────────────────── -->
  <main x-show="!loading && product" class="max-w-[1400px] mx-auto px-4 sm:px-6 py-8 sm:py-12 pb-24 lg:pb-12" style="display:none;">
    
    <!-- ── Two Columns Layout (Desktop 55%/45%, Mobile Stack) ─ -->
    <div class="grid grid-cols-1 lg:grid-cols-[55%_1fr] gap-8 lg:gap-16 items-start">
      
      <!-- ── Kolom Kiri: Gambar (Product Gallery) ──────────── -->
      <div class="product-gallery w-full">
        <div class="relative aspect-[2/3] w-full rounded-2xl overflow-hidden bg-sand border border-border shadow-sm">
          <template x-if="product?.image_url">
            <img :src="product.image_url" :alt="product.name" class="w-full h-full object-cover" />
          </template>
          <template x-if="!product?.image_url">
            <div class="w-full h-full flex flex-col items-center justify-center text-stone/40 bg-sand">
              <svg class="w-16 h-16 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
              </svg>
              <p class="font-medium text-sm">Tidak ada gambar</p>
            </div>
          </template>

          <!-- Gift ready badge -->
          <template x-if="product?.is_gift_ready">
            <span class="absolute top-4 left-4 inline-flex items-center gap-1.5 px-3 py-1 rounded-md bg-sage/90 backdrop-blur-sm text-white text-xs font-bold uppercase tracking-wider shadow-sm">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>
              Gift Ready
            </span>
          </template>
        </div>
      </div>

      <!-- ── Kolom Kanan: Info Produk ─────────────────────── -->
      <div class="flex flex-col">
        
        <!-- 1. Breadcrumb -->
        <nav class="flex items-center gap-2 text-xs text-stone mb-4 flex-wrap">
          <a href="/toko/index.html" class="hover:text-sage-deep transition-colors">Beranda</a>
          <span>/</span>
          <template x-if="product?.category_id">
            <a :href="`/toko/products.html?category=${product.category_id}`" class="hover:text-sage-deep transition-colors" x-text="product.category_name || 'Kategori'"></a>
          </template>
          <template x-if="!product?.category_id">
            <a href="/toko/products.html" class="hover:text-sage-deep transition-colors">Katalog</a>
          </template>
          <span>/</span>
          <span class="text-ink font-medium truncate max-w-[200px]" x-text="product?.name"></span>
        </nav>

        <!-- 2. brand_name (if present) -->
        <template x-if="product?.brand_name">
          <p class="text-xs font-semibold uppercase tracking-[0.2em] text-stone mb-1.5" x-text="product.brand_name"></p>
        </template>

        <!-- 3. Nama produk -->
        <h1 class="font-display text-3xl sm:text-4xl lg:text-5xl font-semibold text-ink leading-[1.15] tracking-tight mb-4" x-text="product?.name"></h1>

        <!-- 4. Harga + Wishlist Heart -->
        <div class="flex items-center justify-between gap-4 mb-6 pb-6 border-b border-border">
          <!-- Harga dengan dual pricing diskon -->
          <div class="flex-1 min-w-0">
            <!-- Ada diskon otomatis -->
            <template x-if="productDiscount && discountedPrice !== null">
              <div>
                <!-- Badge diskon + nama diskon -->
                <div class="flex items-center gap-2 mb-2">
                  <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-sage/15 text-sage-deep border border-sage/30"
                    x-text="'-' + discountPercent + '%'"></span>
                  <span class="text-xs text-stone" x-text="productDiscount?.name"></span>
                </div>
                <!-- Harga coret -->
                <p class="text-sm text-stone line-through" x-text="formatPrice(product?.sell_price)"></p>
                <!-- Harga diskon (besar) -->
                <p class="text-2xl sm:text-3xl font-semibold text-sage-deep" x-text="formatPrice(discountedPrice)"></p>
                <p class="text-xs text-sage-deep/80 mt-0.5" x-text="'Hemat ' + formatPrice(discountSaving)"></p>
              </div>
            </template>
            <!-- Harga normal (tanpa diskon) -->
            <template x-if="!productDiscount || discountedPrice === null">
              <p class="text-2xl sm:text-3xl font-semibold text-ink" x-text="formatPrice(product?.sell_price)"></p>
            </template>
          </div>

          <!-- Wishlist heart -->
          <button
            @click="toggleWishlist()"
            class="w-11 h-11 rounded-full border border-border bg-white text-stone hover:text-red-500 hover:border-red-200 hover:bg-red-50 flex items-center justify-center transition-all shadow-sm flex-shrink-0"
            :aria-label="isWished ? 'Hapus dari wishlist' : 'Tambah ke wishlist'"
          >
            <svg class="w-5 h-5 transition-transform active:scale-75" :class="isWished ? 'fill-red-500 text-red-500' : 'fill-none'" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
            </svg>
          </button>
        </div>

        <!-- 5. PILIH WARNA (hanya tampil kalau produk punya varian aktif) -->
        <template x-if="product?.has_variants">
          <div class="mb-6">
            <div class="flex items-center gap-2 mb-3">
              <span class="text-sm text-ink">Pilih Warna:</span>
              <span class="text-sm font-bold text-ink" x-text="selectedVariant ? selectedVariant.color_name : 'Belum dipilih'"></span>
            </div>

            <div class="flex flex-wrap gap-4">
              <template x-for="v in product.variants" :key="v.id">
                <div class="flex flex-col items-center gap-1">
                  <button
                    type="button"
                    @click="selectVariant(v)"
                    :disabled="v.stock <= 0"
                    :title="`${v.color_name}${v.stock <= 0 ? ' (Habis)' : ''}`"
                    class="w-[44px] h-[44px] rounded-lg border transition-all duration-200 focus:outline-none flex-shrink-0 relative overflow-hidden"
                    :class="[
                      selectedVariant?.id === v.id ? 'border-2 border-sage scale-105 shadow-md ring-2 ring-sage/20' : 'border-border hover:scale-105 shadow-sm',
                      v.stock <= 0 ? 'variant-box-disabled' : 'cursor-pointer'
                    ]"
                    :style="`background-color: ${v.color_hex}`"
                  >
                  </button>
                  <!-- Color Name -->
                  <span class="text-[10px] text-stone text-center font-medium line-clamp-1 max-w-[56px]" x-text="v.color_name"></span>
                  <!-- Variant Stock Info -->
                  <span
                    class="text-[10px] text-center font-semibold"
                    :class="v.stock === 0 ? 'text-red-500' : (v.stock <= 5 ? 'text-amber-600' : 'text-stone/70')"
                    x-text="v.stock === 0 ? 'Habis' : (v.stock <= 5 ? `Sisa ${v.stock}` : 'Tersedia')"
                  ></span>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- 6. INFO STOK (update realtime saat varian dipilih) -->
        <div class="mb-6">
          <template x-if="product?.has_variants && !selectedVariant">
            <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-sand text-stone text-xs font-semibold">
              Pilih warna untuk melihat stok
            </span>
          </template>
          <template x-if="currentAvailableStock > 0 && currentAvailableStock <= 5">
            <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-700 text-xs font-semibold shadow-sm">
              <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
              Sisa <span x-text="currentAvailableStock"></span> item
            </span>
          </template>
          <template x-if="currentAvailableStock === 0 && (!product?.has_variants || selectedVariant)">
            <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-red-500/10 border border-red-500/20 text-red-700 text-xs font-semibold shadow-sm">
              <span class="w-2 h-2 rounded-full bg-red-500"></span>
              Stok Habis
            </span>
          </template>
        </div>

        <!-- 7. INPUT QUANTITY + TOMBOL AKSI -->
        <div class="space-y-3 mb-8">
          <div class="flex items-center gap-3">
            <!-- Quantity Stepper -->
            <div class="flex items-center h-12 rounded-xl border border-border bg-white px-1">
              <button
                type="button"
                @click="decQty()"
                :disabled="qty <= 1 || !canAddToCart"
                class="w-10 h-10 flex items-center justify-center text-stone hover:text-ink hover:bg-sand rounded-lg transition-colors disabled:opacity-30 disabled:hover:bg-transparent cursor-pointer"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" /></svg>
              </button>
              <input type="number" x-model.number="qty" readonly class="w-12 text-center text-ink font-semibold text-sm bg-transparent focus:outline-none" />
              <button
                type="button"
                @click="incQty()"
                :disabled="qty >= currentAvailableStock || !canAddToCart"
                class="w-10 h-10 flex items-center justify-center text-stone hover:text-ink hover:bg-sand rounded-lg transition-colors disabled:opacity-30 disabled:hover:bg-transparent cursor-pointer"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
              </button>
            </div>

            <!-- Tambah ke Keranjang Button -->
            <button
              type="button"
              @click="handleAddToCart()"
              :disabled="!canAddToCart"
              class="flex-1 h-12 rounded-xl bg-sage text-white font-semibold hover:bg-sage-deep disabled:opacity-50 disabled:bg-stone/30 disabled:cursor-not-allowed transition-all shadow-sm flex items-center justify-center gap-2 cursor-pointer"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
              <span x-text="!canAddToCart && currentAvailableStock === 0 ? 'Stok Habis' : 'Tambah ke Keranjang'"></span>
            </button>
          </div>

          <!-- Tanya WA Button -->
          <a
            :href="waMessageLink"
            target="_blank"
            rel="noopener"
            class="flex items-center justify-center w-full h-12 rounded-xl border-2 border-sage text-sage-deep font-semibold hover:bg-sage hover:text-white transition-colors"
          >
            <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
            Tanya via WhatsApp
          </a>
        </div>

        <!-- 8. DETAIL PRODUK (Accordion) -->
        <div class="border-t border-border">
          
          <!-- Deskripsi Accordion -->
          <div class="border-b border-border" x-data="{ open: true }">
            <button @click="open = !open" class="w-full flex items-center justify-between py-4 text-left focus:outline-none cursor-pointer">
              <span class="font-semibold text-ink uppercase tracking-wider text-xs">Deskripsi</span>
              <svg class="w-4 h-4 text-stone transition-transform duration-200" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
            </button>
            <div x-show="open" x-collapse>
              <div class="pb-5 text-stone text-sm leading-relaxed whitespace-pre-line" x-text="product?.description || 'Tidak ada deskripsi.'"></div>
            </div>
          </div>

          <!-- Detail Produk Accordion -->
          <div class="border-b border-border" x-data="{ open: false }">
            <button @click="open = !open" class="w-full flex items-center justify-between py-4 text-left focus:outline-none cursor-pointer">
              <span class="font-semibold text-ink uppercase tracking-wider text-xs">Detail Produk</span>
              <svg class="w-4 h-4 text-stone transition-transform duration-200" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
            </button>
            <div x-show="open" x-collapse>
              <div class="pb-5">
                <dl class="space-y-3 text-xs sm:text-sm">
                  <div class="flex gap-4">
                    <dt class="w-1/3 text-stone font-medium">Brand</dt>
                    <dd class="w-2/3 text-ink font-semibold" x-text="product?.brand_name || '—'"></dd>
                  </div>
                  <div class="flex gap-4">
                    <dt class="w-1/3 text-stone font-medium">Bahan/Material</dt>
                    <dd class="w-2/3 text-ink" x-text="product?.material || '—'"></dd>
                  </div>
                  <div class="flex gap-4">
                    <dt class="w-1/3 text-stone font-medium">Ukuran/Dimensi</dt>
                    <dd class="w-2/3 text-ink" x-text="product?.dimensions || '—'"></dd>
                  </div>
                  <div class="flex gap-4">
                    <dt class="w-1/3 text-stone font-medium">Berat</dt>
                    <dd class="w-2/3 text-ink"><span x-text="product?.weight_gram || '0'"></span> gram</dd>
                  </div>
                </dl>
              </div>
            </div>
          </div>

          <!-- Info Pengiriman Accordion -->
          <div class="border-b border-border" x-data="{ open: false }">
            <button @click="open = !open" class="w-full flex items-center justify-between py-4 text-left focus:outline-none cursor-pointer">
              <span class="font-semibold text-ink uppercase tracking-wider text-xs">Info Pengiriman</span>
              <svg class="w-4 h-4 text-stone transition-transform duration-200" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
            </button>
            <div x-show="open" x-collapse>
              <div class="pb-5">
                <template x-if="shippingZones.length === 0">
                  <p class="text-xs text-stone">Info pengiriman belum tersedia.</p>
                </template>
                <template x-if="shippingZones.length > 0">
                  <div>
                    <table class="w-full text-xs text-left">
                      <tbody class="divide-y divide-border">
                        <template x-for="z in shippingZones" :key="z.id">
                          <tr>
                            <td class="py-2 text-stone font-medium" x-text="z.name"></td>
                            <td class="py-2 text-right font-semibold text-ink" x-text="formatPrice(z.base_cost ?? z.cost)"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                    <template x-if="shippingZones[0]?.free_shipping_min_order">
                      <p class="mt-3 text-xs text-sage-deep font-semibold bg-sage/10 p-2.5 rounded-lg border border-sage/20">
                        Gratis ongkos kirim untuk pembelian di atas <span x-text="formatPrice(shippingZones[0]?.free_shipping_min_order)"></span>.
                      </p>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </div>

        </div>

      </div>
    </div>

    <!-- ── SECTION: Dari Koleksi Yang Sama ─────────────────────── -->
    <template x-if="sameCollectionProducts.length > 0">
      <div class="mt-16 sm:mt-24 pt-12 border-t border-border">
        <h2 class="font-display text-2xl sm:text-3xl font-semibold text-ink tracking-tight mb-6">Dari Koleksi Yang Sama</h2>
        
        <!-- Mobile: horizontal scroll | Desktop: 4 columns -->
        <div class="flex overflow-x-auto hide-scrollbar snap-x gap-4 lg:grid lg:grid-cols-4 pb-4">
          <template x-for="prod in sameCollectionProducts" :key="prod.id">
            <div class="snap-start flex-shrink-0 w-[70vw] sm:w-[45vw] lg:w-auto relative group">
              <a :href="productUrl(prod.id)" class="product-card block rounded-xl border border-border bg-white overflow-hidden hover:border-sage/40 hover:shadow-lg transition-all duration-300">
                <div class="relative aspect-[2/3] bg-sand overflow-hidden">
                  <template x-if="prod.image_url">
                    <img :src="prod.image_url" :alt="prod.name" class="product-img w-full h-full object-cover" loading="lazy" />
                  </template>
                  <template x-if="!prod.image_url">
                    <div class="w-full h-full flex items-center justify-center text-stone/30">
                      <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                    </div>
                  </template>
                </div>
                <div class="p-3 sm:p-4">
                  <p class="text-[10px] font-semibold uppercase tracking-wider text-stone truncate mb-0.5" x-text="prod.brand_name || ''"></p>
                  <h3 class="text-sm font-medium text-ink leading-snug line-clamp-1 group-hover:text-sage-deep transition-colors" x-text="prod.name"></h3>
                  <p class="mt-1.5 text-sm font-semibold text-ink" x-text="formatPrice(prod.sell_price)"></p>

                  <!-- Color dots -->
                  <div x-show="prod.colors?.length > 0" class="mt-2 flex items-center gap-1">
                    <template x-for="c in prod.colors.slice(0, 5)" :key="c.id || c.hex">
                      <span class="w-3.5 h-3.5 rounded-full border border-border shadow-sm flex-shrink-0" :style="`background-color: ${c.hex}`"></span>
                    </template>
                  </div>
                </div>
              </a>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- ── SECTION: Mungkin Kamu Suka ───────────────────────────── -->
    <template x-if="recommendedProducts.length > 0">
      <div class="mt-12 sm:mt-16 pt-12 border-t border-border">
        <h2 class="font-display text-2xl sm:text-3xl font-semibold text-ink tracking-tight mb-6">Mungkin Kamu Suka</h2>
        
        <!-- Mobile: horizontal scroll | Desktop: 4 columns -->
        <div class="flex overflow-x-auto hide-scrollbar snap-x gap-4 lg:grid lg:grid-cols-4 pb-4">
          <template x-for="prod in recommendedProducts" :key="prod.id">
            <div class="snap-start flex-shrink-0 w-[70vw] sm:w-[45vw] lg:w-auto relative group">
              <a :href="productUrl(prod.id)" class="product-card block rounded-xl border border-border bg-white overflow-hidden hover:border-sage/40 hover:shadow-lg transition-all duration-300">
                <div class="relative aspect-[2/3] bg-sand overflow-hidden">
                  <template x-if="prod.image_url">
                    <img :src="prod.image_url" :alt="prod.name" class="product-img w-full h-full object-cover" loading="lazy" />
                  </template>
                  <template x-if="!prod.image_url">
                    <div class="w-full h-full flex items-center justify-center text-stone/30">
                      <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                    </div>
                  </template>
                </div>
                <div class="p-3 sm:p-4">
                  <p class="text-[10px] font-semibold uppercase tracking-wider text-stone truncate mb-0.5" x-text="prod.brand_name || ''"></p>
                  <h3 class="text-sm font-medium text-ink leading-snug line-clamp-1 group-hover:text-sage-deep transition-colors" x-text="prod.name"></h3>
                  <p class="mt-1.5 text-sm font-semibold text-ink" x-text="formatPrice(prod.sell_price)"></p>

                  <!-- Color dots -->
                  <div x-show="prod.colors?.length > 0" class="mt-2 flex items-center gap-1">
                    <template x-for="c in prod.colors.slice(0, 5)" :key="c.id || c.hex">
                      <span class="w-3.5 h-3.5 rounded-full border border-border shadow-sm flex-shrink-0" :style="`background-color: ${c.hex}`"></span>
                    </template>
                  </div>
                </div>
              </a>
            </div>
          </template>
        </div>
      </div>
    </template>

  </main>

  <!-- ── STICKY BOTTOM ACTION BAR FOR MOBILE ─────────────────── -->
  <div x-show="!loading && product" class="lg:hidden fixed bottom-0 left-0 right-0 z-30 bg-cream/95 backdrop-blur-md border-t border-border p-3 shadow-lg flex items-center gap-2" style="display:none;">
    <button
      type="button"
      @click="handleAddToCart()"
      :disabled="!canAddToCart"
      class="flex-1 h-12 rounded-xl bg-sage text-white font-semibold hover:bg-sage-deep disabled:opacity-50 disabled:bg-stone/30 disabled:cursor-not-allowed transition-all text-xs sm:text-sm flex items-center justify-center gap-1.5 cursor-pointer"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
      <span x-text="!canAddToCart && currentAvailableStock === 0 ? 'Stok Habis' : 'Tambah ke Keranjang'"></span>
    </button>

    <a
      :href="waMessageLink"
      target="_blank"
      rel="noopener"
      class="flex-1 h-12 rounded-xl border-2 border-sage text-sage-deep font-semibold hover:bg-sage hover:text-white transition-colors text-xs sm:text-sm flex items-center justify-center gap-1.5"
    >
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
    Tanya WA
  </a>
</div>

  <div id="footer-container"></div>

  <script type="module" src="/src/toko/product-detail.js"></script>
</body>
</html>
