<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk & Daftar — Giva Store</title>
  <meta name="description" content="Masuk atau buat akun di Giva Store untuk berbelanja koleksi pilihan dan menyimpan wishlist." />
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>

<body class="bg-cream text-ink min-h-screen font-sans antialiased flex flex-col justify-center items-center p-4 sm:p-6" x-data="storeAuth" x-init="init()" x-cloak>

  <!-- Logo Branding Above Card -->
  <div class="mb-6 text-center">
    <a href="/toko/index.html" class="inline-block group">
      <h1 class="font-display text-4xl sm:text-5xl font-semibold text-ink group-hover:text-sage-deep transition-colors tracking-tight">Giva Store</h1>
    </a>
  </div>

  <!-- Main Card Container (max-w 440px) -->
  <div class="w-full max-w-[440px] bg-white rounded-3xl border border-border shadow-sm p-6 sm:p-8 relative overflow-hidden">

    <!-- Alert Success / Info Message (e.g. from query param or action) -->
    <div x-show="paramMsg" class="mb-5 p-3.5 rounded-2xl bg-sage/10 text-sage-deep text-sm font-medium border border-sage/20 flex items-start gap-2" style="display: none;">
      <svg class="w-5 h-5 flex-shrink-0 text-sage-deep mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
      <span x-text="paramMsg"></span>
    </div>

    <!-- Error Alert -->
    <div x-show="error" class="mb-5 p-3.5 rounded-2xl bg-red-50 text-red-600 text-sm font-medium border border-red-100 flex items-start gap-2" style="display: none;">
      <svg class="w-5 h-5 flex-shrink-0 text-red-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      <span x-text="error"></span>
    </div>

    <!-- Success Alert -->
    <div x-show="success" class="mb-5 p-3.5 rounded-2xl bg-sage/10 text-sage-deep text-sm font-medium border border-sage/20 flex items-start gap-2" style="display: none;">
      <svg class="w-5 h-5 flex-shrink-0 text-sage-deep mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
      <span x-text="success"></span>
    </div>

    <!-- ── INLINE FORGOT PASSWORD FORM ───────────────────────────── -->
    <div x-show="showForgot" style="display: none;">
      <div class="mb-6">
        <h2 class="font-display text-2xl font-semibold text-ink mb-1">Lupa Password</h2>
        <p class="text-xs text-stone leading-relaxed">Masukkan email Anda. Kami akan mengirimkan tautan untuk mengatur ulang password.</p>
      </div>

      <form @submit.prevent="handleForgot" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-ink mb-1.5">Email</label>
          <input
            type="email"
            x-model="forgot.email"
            required
            placeholder="nama@email.com"
            class="w-full px-4 py-3 text-sm rounded-xl border border-border bg-cream/50 focus:bg-white focus:outline-none focus:border-sage focus:ring-1 focus:ring-sage transition-all"
          />
        </div>

        <button
          type="submit"
          :disabled="loading"
          class="w-full py-3.5 rounded-xl bg-sage text-white font-semibold hover:bg-sage-deep disabled:opacity-50 transition-all shadow-sm flex items-center justify-center gap-2 cursor-pointer text-sm"
        >
          <span x-text="loading ? 'Mengirim...' : 'Kirim Link Reset'"></span>
        </button>
      </form>

      <div class="mt-5 text-center">
        <button
          type="button"
          @click="showForgot = false; error = ''; success = ''"
          class="text-xs font-semibold text-stone hover:text-ink transition-colors cursor-pointer"
        >
          ← Kembali ke halaman Masuk
        </button>
      </div>
    </div>

    <!-- ── AUTH TABS: MASUK | DAFTAR ──────────────────────────────── -->
    <div x-show="!showForgot">

      <!-- Pill Toggle Tab Header -->
      <div class="flex p-1 mb-6 bg-sand/60 rounded-2xl border border-border">
        <button
          type="button"
          @click="activeTab = 'login'; error = ''; success = ''"
          :class="activeTab === 'login' ? 'bg-sage text-white shadow-sm font-semibold' : 'text-stone hover:text-ink font-medium'"
          class="flex-1 py-2.5 text-xs sm:text-sm rounded-xl transition-all duration-200 cursor-pointer"
        >
          Masuk
        </button>
        <button
          type="button"
          @click="activeTab = 'register'; error = ''; success = ''"
          :class="activeTab === 'register' ? 'bg-sage text-white shadow-sm font-semibold' : 'text-stone hover:text-ink font-medium'"
          class="flex-1 py-2.5 text-xs sm:text-sm rounded-xl transition-all duration-200 cursor-pointer"
        >
          Daftar
        </button>
      </div>

      <!-- ── TAB MASUK ──────────────────────────────────────────── -->
      <form x-show="activeTab === 'login'" @submit.prevent="handleLogin" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-ink mb-1.5">Email</label>
          <input
            type="email"
            x-model="login.email"
            required
            placeholder="nama@email.com"
            class="w-full px-4 py-3 text-sm rounded-xl border border-border bg-cream/50 focus:bg-white focus:outline-none focus:border-sage focus:ring-1 focus:ring-sage transition-all"
          />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold uppercase tracking-wider text-ink">Password</label>
          </div>
          <div class="relative">
            <input
              :type="showPassword ? 'text' : 'password'"
              x-model="login.password"
              required
              placeholder="••••••••"
              class="w-full px-4 py-3 pr-10 text-sm rounded-xl border border-border bg-cream/50 focus:bg-white focus:outline-none focus:border-sage focus:ring-1 focus:ring-sage transition-all"
            />
            <button
              type="button"
              @click="showPassword = !showPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-stone hover:text-ink p-1 cursor-pointer"
              :title="showPassword ? 'Sembunyikan password' : 'Tampilkan password'"
            >
              <svg x-show="!showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <svg x-show="showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display:none;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
            </button>
          </div>
        </div>

        <button
          type="submit"
          :disabled="loading"
          class="w-full py-3.5 rounded-xl bg-sage text-white font-semibold hover:bg-sage-deep disabled:opacity-50 transition-all shadow-sm flex items-center justify-center gap-2 cursor-pointer text-sm"
        >
          <span x-text="loading ? 'Memproses...' : 'Masuk'"></span>
        </button>

        <!-- Inline Forgot Password Link -->
        <div class="pt-2 text-center">
          <button
            type="button"
            @click="showForgot = true; error = ''; success = ''"
            class="text-xs font-semibold text-sage hover:text-sage-deep hover:underline transition-colors cursor-pointer"
          >
            Lupa password?
          </button>
        </div>
      </form>

      <!-- ── TAB DAFTAR ──────────────────────────────────────────── -->
      <form x-show="activeTab === 'register'" @submit.prevent="handleRegister" class="space-y-4" style="display:none;">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-ink mb-1.5">Nama Lengkap</label>
          <input
            type="text"
            x-model="register.name"
            required
            placeholder="Nama lengkap Anda"
            class="w-full px-4 py-3 text-sm rounded-xl border border-border bg-cream/50 focus:bg-white focus:outline-none focus:border-sage focus:ring-1 focus:ring-sage transition-all"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-ink mb-1.5">Email</label>
          <input
            type="email"
            x-model="register.email"
            required
            placeholder="nama@email.com"
            class="w-full px-4 py-3 text-sm rounded-xl border border-border bg-cream/50 focus:bg-white focus:outline-none focus:border-sage focus:ring-1 focus:ring-sage transition-all"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-ink mb-1.5">Password</label>
          <div class="relative">
            <input
              :type="showPassword ? 'text' : 'password'"
              x-model="register.password"
              required
              minlength="8"
              placeholder="Minimal 8 karakter"
              class="w-full px-4 py-3 pr-10 text-sm rounded-xl border border-border bg-cream/50 focus:bg-white focus:outline-none focus:border-sage focus:ring-1 focus:ring-sage transition-all"
            />
            <button
              type="button"
              @click="showPassword = !showPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-stone hover:text-ink p-1 cursor-pointer"
            >
              <svg x-show="!showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <svg x-show="showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display:none;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
            </button>
          </div>

          <!-- Password Strength Indicator -->
          <div x-show="register.password.length > 0" class="mt-2 space-y-1" style="display:none;">
            <div class="h-1.5 w-full bg-sand rounded-full overflow-hidden">
              <div class="h-full transition-all duration-300" :class="passwordStrength.bar"></div>
            </div>
            <div class="flex items-center justify-between text-[11px]">
              <span class="text-stone">Kekuatan password:</span>
              <span class="font-bold" :class="passwordStrength.color" x-text="passwordStrength.label"></span>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-ink mb-1.5">Konfirmasi Password</label>
          <div class="relative">
            <input
              :type="showPassword ? 'text' : 'password'"
              x-model="register.passwordConfirm"
              required
              minlength="8"
              placeholder="Ulangi password"
              class="w-full px-4 py-3 pr-10 text-sm rounded-xl border border-border bg-cream/50 focus:bg-white focus:outline-none focus:border-sage focus:ring-1 focus:ring-sage transition-all"
            />
            <button
              type="button"
              @click="showPassword = !showPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-stone hover:text-ink p-1 cursor-pointer"
              :title="showPassword ? 'Sembunyikan password' : 'Tampilkan password'"
            >
              <svg x-show="!showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <svg x-show="showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display:none;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
            </button>
          </div>
        </div>

        <!-- Terms Agreement Checkbox -->
        <label class="flex items-start gap-2.5 pt-1 cursor-pointer">
          <input
            type="checkbox"
            x-model="register.agreeTerms"
            required
            class="w-4 h-4 mt-0.5 rounded border-border text-sage focus:ring-sage/30 accent-sage cursor-pointer"
          />
          <span class="text-xs text-stone leading-relaxed">
            Saya setuju dengan <a href="#" @click.prevent class="text-sage-deep hover:underline">Syarat & Ketentuan</a> Giva Store.
          </span>
        </label>

        <button
          type="submit"
          :disabled="loading || !register.agreeTerms"
          class="w-full py-3.5 rounded-xl bg-sage text-white font-semibold hover:bg-sage-deep disabled:opacity-50 transition-all shadow-sm flex items-center justify-center gap-2 cursor-pointer text-sm"
        >
          <span x-text="loading ? 'Membuat Akun...' : 'Daftar'"></span>
        </button>
      </form>

    </div>

  </div>

  <script type="module" src="/src/toko/login.js"></script>
</body>
</html>
