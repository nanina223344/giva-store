<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giva Store — Toko Online</title>
  <meta name="description"
    content="Giva Store — koleksi lifestyle pilihan. Temukan produk terbaru dengan desain timeless dan material berkualitas." />
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    [x-cloak] { display: none !important; }

    .hero-grain::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.12;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .product-card:hover .product-img {
      transform: scale(1.04);
    }

    .product-img {
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    
    .collection-card:hover .collection-img {
      transform: scale(1.03);
    }
    .collection-img {
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
  </style>
</head>

<body class="bg-cream text-ink min-h-screen font-sans antialiased" x-data="storeHome" x-init="init()" x-cloak>

  <div id="navbar-container"></div>

  <main>
    <!-- ── Hero ───────────────────────────────────────────────── -->
    <template x-if="sections.hero">
      <section class="relative overflow-hidden hero-grain min-h-[500px] sm:min-h-[600px]" :style="getBgStyle(sections.hero)">
        <!-- Video Layer -->
        <template x-if="hasVideo(sections.hero)">
          <div class="absolute inset-0">
            <video :src="sections.hero.bg_video_url" :style="getVideoStyle(sections.hero)" autoplay muted loop playsinline></video>
          </div>
        </template>
        <!-- Overlay Layer -->
        <template x-if="hasOverlay(sections.hero)">
          <div class="absolute inset-0 pointer-events-none z-10" :style="`background-color: rgba(0,0,0,${sections.hero.bg_overlay_opacity || 0});`"></div>
        </template>

        <!-- Text container — position driven by text_position -->
        <div class="absolute inset-0 z-20 flex flex-col"
          :style="getTextPositionStyle(sections.hero)">
          <div class="max-w-2xl">
            <p class="inline-flex items-center gap-2 text-[11px] sm:text-xs font-semibold tracking-[0.2em] uppercase mb-5" :style="`color: ${sections.hero.text_color || '#FAF8F3'}; opacity: 0.85;`">
              <span class="w-8 h-px" style="background-color: currentColor; opacity: 0.5;"></span>
              Welcome
            </p>
            <h1 class="font-display text-4xl sm:text-5xl lg:text-6xl font-semibold leading-[1.1] tracking-tight drop-shadow-sm" :style="`color: ${sections.hero.text_color || '#FAF8F3'};`" x-text="sections.hero.title"></h1>
            <p class="mt-6 text-base sm:text-lg leading-relaxed max-w-xl font-medium drop-shadow-sm" :style="`color: ${sections.hero.text_color || '#FAF8F3'}; opacity: 0.9;`" x-text="sections.hero.subtitle"></p>
            <div class="mt-10 flex flex-wrap items-center gap-4">
              <template x-if="sections.hero.cta_text && sections.hero.cta_url">
                <a :href="sections.hero.cta_url" class="inline-flex items-center justify-center min-h-[50px] px-8 rounded-full border text-sm font-semibold hover:bg-black/10 backdrop-blur-sm transition-all hover:-translate-y-0.5" :style="`border-color: ${sections.hero.text_color}; color: ${sections.hero.text_color};`" x-text="sections.hero.cta_text"></a>
              </template>
            </div>
          </div>
        </div>
      </section>
    </template>
    
    <!-- ── Belanja berdasarkan kategori ────────────────────────── -->
    <template x-if="sections.categories">
      <section id="kategori" class="relative min-h-[400px]" :style="getBgStyle(sections.categories)">
        <template x-if="hasVideo(sections.categories)">
          <div class="absolute inset-0">
            <video :src="sections.categories.bg_video_url" :style="getVideoStyle(sections.categories)" autoplay muted loop playsinline></video>
          </div>
        </template>
        <template x-if="hasOverlay(sections.categories)">
          <div class="absolute inset-0 pointer-events-none z-10" :style="`background-color: rgba(0,0,0,${sections.categories.bg_overlay_opacity || 0});`"></div>
        </template>

        <!-- Text & content — position driven by text_position -->
        <div class="relative z-20 px-4 sm:px-8 py-12 sm:py-16" :style="`color: ${sections.categories.text_color || '#232019'};`">
          <div class="max-w-6xl mx-auto">
            <div class="mb-10 text-center sm:text-left">
              <h2 class="font-display text-2xl sm:text-3xl font-semibold" style="color: inherit;" x-text="sections.categories.title"></h2>
              <p class="mt-2 text-sm sm:text-base font-medium" style="color: inherit; opacity: 0.8;" x-show="sections.categories.subtitle" x-text="sections.categories.subtitle"></p>
            </div>

            <div x-show="loadingCategories" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-4 sm:gap-6">
              <template x-for="i in 6" :key="'sk-cat-'+i">
                <div class="flex flex-col items-center gap-3 animate-pulse">
                  <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-sand"></div>
                  <div class="h-3 w-16 bg-sand rounded"></div>
                </div>
              </template>
            </div>

            <div x-show="!loadingCategories && categories.length > 0" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-7 gap-4 sm:gap-6" style="display:none;">
              <template x-for="cat in categories" :key="cat.id">
                <a :href="'/toko/products.html?category=' + cat.id" class="group flex flex-col items-center gap-3">
                  <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-cream border border-border flex items-center justify-center text-sage group-hover:bg-sage/10 group-hover:border-sage/30 transition-colors shadow-sm">
                    <template x-if="cat.name.toLowerCase().includes('ransel')">
                      <svg class="w-8 h-8 sm:w-10 sm:h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
                    </template>
                    <template x-if="cat.name.toLowerCase().includes('selempang') || cat.name.toLowerCase().includes('tote') || cat.name.toLowerCase().includes('jinjing') || cat.name.toLowerCase().includes('mini') || (cat.name.toLowerCase().includes('tas') && !cat.name.toLowerCase().includes('ransel'))">
                      <svg class="w-8 h-8 sm:w-10 sm:h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" /></svg>
                    </template>
                    <template x-if="cat.name.toLowerCase().includes('dompet')">
                      <svg class="w-8 h-8 sm:w-10 sm:h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" /></svg>
                    </template>
                    <template x-if="!cat.name.toLowerCase().includes('tas') && !cat.name.toLowerCase().includes('dompet') && !cat.name.toLowerCase().includes('ransel') && !cat.name.toLowerCase().includes('selempang')">
                      <svg class="w-8 h-8 sm:w-10 sm:h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>
                    </template>
                  </div>
                  <span class="text-xs sm:text-sm font-medium text-ink text-center leading-tight max-w-[80px] sm:max-w-[96px] group-hover:text-sage-deep transition-colors" x-text="cat.name"></span>
                </a>
              </template>
              <!-- Static link for Hadiah Spesial -->
              <a href="/toko/products.html?gift=true" class="group flex flex-col items-center gap-3">
                <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-cream border border-border flex items-center justify-center text-sage group-hover:bg-sage/10 group-hover:border-sage/30 transition-colors shadow-sm">
                  <svg class="w-8 h-8 sm:w-10 sm:h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" /></svg>
                </div>
                <span class="text-xs sm:text-sm font-medium text-ink text-center leading-tight max-w-[80px] sm:max-w-[96px] group-hover:text-sage-deep transition-colors">Hadiah Spesial</span>
              </a>
            </div>
          </div>
        </div>
      </section>
    </template>
    
        <!-- ── Dynamic Collections ─────────────────────────────────── -->
    <template x-for="c in collections" :key="c.id">
      <section class="border-y border-border/30 relative min-h-[400px]" :style="getBgStyle(c)">
        <template x-if="hasVideo(c)">
          <div class="absolute inset-0">
            <video :src="c.bg_video_url" :style="getVideoStyle(c)" autoplay muted loop playsinline></video>
          </div>
        </template>
        <template x-if="hasOverlay(c)">
          <div class="absolute inset-0 pointer-events-none z-10" :style="`background-color: rgba(0,0,0,${c.bg_overlay_opacity || 0});`"></div>
        </template>

        <!-- Text container — position driven by text_position -->
        <div class="absolute inset-0 z-20 flex flex-col"
          :style="getTextPositionStyle(c)">
          <div class="max-w-xl" :style="`color: ${c.text_color || '#232019'};`">
            <h2 class="font-display text-3xl sm:text-4xl lg:text-5xl font-semibold tracking-tight mb-2" style="color: inherit;" x-text="c.name"></h2>
            <p class="text-base sm:text-lg font-medium" style="color: inherit; opacity: 0.75;" x-show="c.subtitle" x-text="c.subtitle"></p>
            <template x-if="c.products && c.products.length > 0">
              <a :href="'/toko/products.html?collection=' + c.id"
                class="mt-5 inline-flex items-center gap-2 px-6 py-3 rounded-full text-sm font-semibold transition-colors shadow-sm"
                :style="`border: 1px solid ${c.text_color || '#232019'}; color: ${c.text_color || '#232019'}; background-color: transparent;`"
                onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
                Lihat Semua
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" /></svg>
              </a>
            </template>
          </div>
        </div>

        <!-- Product scroll — always below text via bottom padding -->
        <template x-if="c.products && c.products.length > 0">
          <div class="relative z-30 px-4 sm:px-8 pb-10 pt-64 sm:pt-72">
            <div class="flex overflow-x-auto snap-x snap-mandatory gap-4 sm:gap-6 pb-4 hide-scrollbar" style="scrollbar-width: none;">
              <template x-for="prod in c.products" :key="prod.id">
                <a :href="productUrl(prod.id)"
                  class="snap-start shrink-0 w-56 sm:w-64 product-card relative group block rounded-2xl border border-border bg-white overflow-hidden hover:shadow-lg transition-all">
                  <div x-show="prod.is_gift_ready" class="absolute top-3 right-3 z-10 pointer-events-none">
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-sage/90 backdrop-blur-sm text-white text-[10px] font-semibold">
                      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" /></svg>
                    </span>
                  </div>
                  <div class="relative aspect-[4/5] bg-sand overflow-hidden">
                    <template x-if="prod.image_url">
                      <img :src="prod.image_url" :alt="prod.name" class="product-img w-full h-full object-cover" loading="lazy" />
                    </template>
                    <template x-if="!prod.image_url">
                      <div class="w-full h-full flex items-center justify-center text-stone/40">
                        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                      </div>
                    </template>
                  </div>
                  <div class="p-4">
                    <p class="text-[11px] font-semibold uppercase tracking-widest text-stone truncate mb-1" x-text="prod.brand_name || prod.category_name || 'Produk'"></p>
                    <h3 class="font-display text-base font-semibold text-ink leading-tight line-clamp-2 group-hover:text-sage-deep transition-colors" x-text="prod.name"></h3>
                    <p class="mt-2 text-sm font-semibold text-ink" x-text="formatPrice(prod.sell_price)"></p>
                    <div x-show="prod.colors?.length" class="mt-2 flex items-center gap-1.5 flex-wrap">
                      <template x-for="cl in prod.colors" :key="cl.id || cl.hex">
                        <span class="w-3 h-3 rounded-full border border-border shadow-sm" :style="`background-color: ${cl.hex}`" :title="cl.name"></span>
                      </template>
                    </div>
                  </div>
                </a>
              </template>
            </div>
          </div>
        </template>
      </section>
    </template>

    <!-- ── Mengapa Giva Store ─────────────────────────────────── -->

    <template x-if="sections.why_us">
      <section id="tentang" class="border-t border-border relative min-h-[400px] flex items-center" :style="getBgStyle(sections.why_us)">
        <template x-if="hasVideo(sections.why_us)">
          <div class="absolute inset-0">
            <video :src="sections.why_us.bg_video_url" :style="getVideoStyle(sections.why_us)" autoplay muted loop playsinline></video>
          </div>
        </template>
        <template x-if="hasOverlay(sections.why_us)">
          <div class="absolute inset-0 pointer-events-none z-10" :style="`background-color: rgba(0,0,0,${sections.why_us.bg_overlay_opacity || 0});`"></div>
        </template>
        
        <div class="relative max-w-6xl mx-auto px-4 sm:px-6 py-20 sm:py-28 z-20 w-full" :style="`color: ${sections.why_us.text_color || '#232019'};`">
          <div class="text-center max-w-2xl mx-auto mb-16">
            <p class="text-xs font-semibold tracking-[0.18em] uppercase mb-3" style="color: inherit; opacity: 0.8;" x-text="sections.why_us.subtitle"></p>
            <h2 class="font-display text-3xl sm:text-4xl font-semibold tracking-tight" style="color: inherit;" x-text="sections.why_us.title"></h2>
          </div>
  
          <div class="grid sm:grid-cols-3 gap-10 lg:gap-16">
          <div class="text-center">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-sage/10 text-sage-deep flex items-center justify-center mb-6">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" /></svg>
            </div>
            <h3 class="font-display text-2xl font-semibold mb-3" style="color: inherit;">Kurasi Terpilih</h3>
            <p class="text-sm leading-relaxed" style="color: inherit; opacity: 0.85;">Setiap produk kami pilih sendiri, bukan sekadar pajang. Hanya produk dengan desain terbaik yang masuk katalog kami.</p>
          </div>
          <div class="text-center">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-sage/10 text-sage-deep flex items-center justify-center mb-6">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" /></svg>
            </div>
            <h3 class="font-display text-2xl font-semibold mb-3" style="color: inherit;">Kualitas Terjamin</h3>
            <p class="text-sm leading-relaxed" style="color: inherit; opacity: 0.85;">Bekerja sama langsung dengan supplier dan pengrajin terpercaya untuk memastikan standar material yang tinggi.</p>
          </div>
          <div class="text-center">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-sage/10 text-sage-deep flex items-center justify-center mb-6">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" /></svg>
            </div>
            <h3 class="font-display text-2xl font-semibold mb-3" style="color: inherit;">Hadiah yang Berkesan</h3>
            <p class="text-sm leading-relaxed" style="color: inherit; opacity: 0.85;">Bingung cari kado? Opsi "Siap Dijadikan Hadiah" kami lengkapi dengan kemasan manis dan kartu ucapan spesial.</p>
          </div>
        </div>
        </div>
      </section>
    </template>
  </main>

  <div id="footer-container"></div>

  <script type="module" src="/src/toko/home.js"></script>
</body>
</html>
