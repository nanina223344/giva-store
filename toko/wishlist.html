<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wishlist Saya — Giva Store</title>
  <meta name="description" content="Simpan dan lihat produk-produk impian pilihan Anda di Wishlist Giva Store." />
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    [x-cloak] { display: none !important; }
    
    .product-card:hover .product-img { transform: scale(1.05); }
    .product-img { transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1); }
  </style>
</head>

<body class="bg-cream text-ink min-h-screen font-sans antialiased flex flex-col" x-data="storeWishlist" x-init="init()" x-cloak>

  <div id="navbar-container"></div>

  <!-- Toast Notification -->
  <div
    x-show="toast.show"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0 translate-y-2 scale-95"
    x-transition:enter-end="opacity-100 translate-y-0 scale-100"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100 translate-y-0 scale-100"
    x-transition:leave-end="opacity-0 translate-y-2 scale-95"
    class="fixed top-20 right-4 z-50 px-4 py-3 rounded-2xl shadow-xl border flex items-center gap-3 backdrop-blur-md text-sm font-semibold max-w-sm"
    :class="toast.type === 'warning' ? 'bg-amber-600 text-white border-amber-700' : 'bg-sage-deep text-white border-sage-deep'"
    style="display: none;"
  >
    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path x-show="toast.type !== 'warning'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      <path x-show="toast.type === 'warning'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
    </svg>
    <span x-text="toast.message"></span>
  </div>

  <!-- Loading State (Auth Guard & Fetch) -->
  <div x-show="loading" class="flex-1 flex items-center justify-center min-h-[50vh]">
    <svg class="animate-spin w-8 h-8 text-sage" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
  </div>

  <!-- Main Content Container -->
  <main x-show="!loading && customer" class="flex-1 max-w-[1400px] w-full mx-auto px-4 sm:px-6 py-8 sm:py-12" style="display:none;">
    
    <!-- Page Header -->
    <div class="mb-8 pb-6 border-b border-border flex items-end justify-between gap-4">
      <div>
        <h1 class="font-display text-4xl sm:text-5xl font-semibold text-ink tracking-tight mb-2">
          Wishlist Saya
          <span class="text-2xl font-normal text-stone ml-2" x-text="`(${wishlistProducts.length})`"></span>
        </h1>
        <p class="text-stone text-sm sm:text-base">Kumpulan produk impian favorit yang Anda simpan.</p>
      </div>
    </div>

    <!-- ── EMPTY STATE ───────────────────────────────────────────── -->
    <div x-show="wishlistProducts.length === 0" class="text-center py-20 bg-white rounded-3xl border border-dashed border-border" style="display:none;">
      <div class="w-20 h-20 mx-auto bg-sand rounded-full flex items-center justify-center text-stone mb-6">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
        </svg>
      </div>
      <h2 class="font-display text-3xl font-semibold text-ink mb-3">Wishlist kamu masih kosong</h2>
      <p class="text-stone max-w-md mx-auto mb-8 text-sm sm:text-base leading-relaxed">
        Simpan produk yang kamu suka dengan klik ikon hati di halaman produk.
      </p>
      <a
        href="/toko/products.html"
        class="inline-flex items-center justify-center px-8 py-3.5 rounded-full bg-sage text-white font-semibold hover:bg-sage-deep transition-all shadow-sm text-sm"
      >
        Lihat Produk
      </a>
    </div>

    <!-- ── GRID PRODUK WISHLIST (4 kolom desktop, 2 kolom mobile) ── -->
    <div x-show="wishlistProducts.length > 0" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4" style="display:none;">
      <template x-for="prod in wishlistProducts" :key="prod.id">
        <div class="relative group">
          <a
            :href="productUrl(prod.id)"
            class="product-card block rounded-xl border border-border bg-white overflow-hidden hover:border-sage/40 hover:shadow-lg transition-all duration-300 flex flex-col h-full"
            :class="prod.total_stock === 0 ? 'opacity-75 grayscale-[15%]' : ''"
          >
            <!-- Image Area (Portrait 2:3) -->
            <div class="relative aspect-[2/3] bg-sand overflow-hidden flex-shrink-0">
              <template x-if="prod.image_url">
                <img :src="prod.image_url" :alt="prod.name" class="product-img w-full h-full object-cover" loading="lazy" />
              </template>
              <template x-if="!prod.image_url">
                <div class="w-full h-full flex items-center justify-center text-stone/30">
                  <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                  </svg>
                </div>
              </template>

              <!-- Stock Badges -->
              <div class="absolute top-2.5 left-2.5 flex flex-col gap-1.5 items-start pointer-events-none z-10">
                <template x-if="prod.total_stock === 0">
                  <span class="inline-flex px-2 py-0.5 rounded-md bg-stone/75 backdrop-blur-sm text-white text-[10px] font-bold uppercase tracking-wider">Stok Habis</span>
                </template>
                <template x-if="prod.total_stock > 0 && prod.total_stock <= 3">
                  <span class="inline-flex px-2 py-0.5 rounded-md bg-amber-500/85 backdrop-blur-sm text-white text-[10px] font-bold uppercase tracking-wider shadow-sm">Hampir Habis</span>
                </template>
                <template x-if="prod.is_gift_ready">
                  <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-sage/90 backdrop-blur-sm text-white text-[10px] font-bold uppercase tracking-wider shadow-sm">Gift Ready</span>
                </template>
              </div>
            </div>

            <!-- Info Area -->
            <div class="p-3 sm:p-4 flex flex-col justify-between flex-1">
              <div>
                <p class="text-[10px] sm:text-[11px] font-semibold uppercase tracking-[0.14em] text-stone truncate mb-0.5" x-text="prod.brand_name || ''"></p>
                <h3 class="text-sm sm:text-base font-medium text-ink leading-snug line-clamp-2 group-hover:text-sage-deep transition-colors" x-text="prod.name"></h3>
                
                <!-- Wishlisted variant name if specified -->
                <template x-if="prod.wishlist_color_name">
                  <p class="text-[11px] font-semibold text-sage-deep mt-1" x-text="`Warna: ${prod.wishlist_color_name}`"></p>
                </template>
              </div>

              <div class="mt-3 pt-2">
                <p class="text-sm sm:text-[15px] font-semibold text-ink mb-2" x-text="formatPrice(prod.sell_price)"></p>

                <!-- Color swatches -->
                <div x-show="prod.colors?.length > 0 && !prod.wishlist_color_name" class="mb-3 flex items-center gap-1.5">
                  <template x-for="c in prod.colors.slice(0, 5)" :key="c.id || c.hex">
                    <span class="w-3.5 h-3.5 rounded-full border border-border shadow-sm flex-shrink-0" :style="`background-color: ${c.hex}`" :title="c.name"></span>
                  </template>
                </div>

                <!-- Tambah ke Keranjang Button -->
                <button
                  type="button"
                  @click.prevent.stop="handleAddToCart(prod)"
                  :disabled="prod.total_stock <= 0"
                  class="w-full py-2 px-3 rounded-lg bg-sage text-white text-xs font-semibold hover:bg-sage-deep disabled:opacity-40 disabled:bg-stone/30 disabled:cursor-not-allowed transition-all shadow-sm flex items-center justify-center gap-1.5 cursor-pointer"
                >
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                  <span x-text="prod.total_stock <= 0 ? 'Stok Habis' : 'Tambah ke Keranjang'"></span>
                </button>
              </div>
            </div>
          </a>

          <!-- Filled Heart Button (Remove from Wishlist) -->
          <button
            type="button"
            @click.prevent.stop="removeFromWishlist(prod.id)"
            class="absolute top-2.5 right-2.5 z-20 w-8 h-8 rounded-full bg-white/90 backdrop-blur shadow-sm flex items-center justify-center transition-all hover:scale-110 active:scale-90 text-sage-deep cursor-pointer"
            title="Hapus dari Wishlist"
          >
            <svg class="w-4 h-4 fill-sage-deep text-sage-deep" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
            </svg>
          </button>
        </div>
      </template>
    </div>

  </main>

  <div id="footer-container"></div>

  <script type="module" src="/src/toko/wishlist.js"></script>
</body>
</html>
